<!doctype html>
<html lang="es" class="light dark:bg-gray-900 dark:text-gray-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>
  <body
    class="bg-gray-100 min-h-screen p-8 dark:bg-slate-900 dark:text-gray-100 transition-colors duration-300"
  >
    <div class="max-w-4xl mx-auto space-y-6">
      <header
        class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 gap-4"
      >
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">
          📌 Mis Notas
          <span id="notes-count" class="text-sm opacity-80 font-normal"></span>
        </h1>
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar notas..."
          class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-lg px-4 py-2 w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </header>

      <section
        class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm space-y-4"
      >
        <h2 class="text-lg font-semibold text-gray-700 dark:text-white">
          Crear Nueva Nota
        </h2>
        <div class="flex flex-col gap-3">
          <input
            type="text"
            id="titleInput"
            placeholder="Título (mínimo 3 caracteres)"
            class="border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-white dark:bg-gray-700 dark:text-gray-100 dark:border-gray-600"
          />
          <textarea
            id="contentInput"
            placeholder="Contenido de la nota..."
            class="border rounded-lg px-4 py-2 h-24 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-white dark:bg-gray-700 dark:text-gray-100 dark:border-gray-600"
          ></textarea>
          <button
            id="saveBtn"
            class="bg-blue-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-blue-700 self-start transition-colors dark:hover:bg-slate-800"
          >
            Guardar Nota
          </button>
        </div>
      </section>

      <main
        id="notesContainer"
        class="grid grid-cols-1 md:grid-cols-2 gap-4"
      ></main>
    </div>

    <script>
      const notesContainer = document.getElementById("notesContainer");
      const searchInput = document.getElementById("searchInput");
      const titleInput = document.getElementById("titleInput");
      const contentInput = document.getElementById("contentInput");
      const saveBtn = document.getElementById("saveBtn");

      function formatDate(isoString) {
        return new Date(isoString).toLocaleDateString('es-CL', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      }

      async function loadNotes(query = "") {
        try {
          const res = await fetch(
            `/notes${query ? `?search=${encodeURIComponent(query)}` : ""}`,
          );
          if (res.ok) {
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
              notesContainer.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-2 text-center py-8">No se encontraron notas.</p>`;
              notesCount.textContent = ` (0)`;
              return;
            }

            notesContainer.innerHTML = data
              .map(
                (n) => `
        <div class="bg-white dark:bg-gray-800 p-5 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 border-l-4 border-l-blue-500 dark:border-l-blue-500 flex flex-col justify-between transition-all duration-200 ease-in-out hover:scale-105 hover:bg-slate-50 dark:hover:bg-gray-750 hover:shadow-xl">
          <div>
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-gray-800 dark:text-gray-100 text-lg">${n.title}</h3>
              <button onclick="deleteNote(${n.id})" class="text-red-500 hover:text-red-700 font-semibold text-sm p-1 rounded transition-colors" title="Eliminar nota">
                ✕
              </button>
            </div>
            <p class="text-gray-600 dark:text-gray-300 mt-2 text-sm whitespace-pre-line">${n.content || ""}</p>
          </div>
          <div class="flex justify-between items-center text-xs text-gray-400 dark:text-gray-500 mt-4">
            <span>ID: ${n.id}</span>
            <span>📅 ${formatDate(n.createdAt)}</span>
          </div>
        </div>
      `,)
              .join("");
            notesCount.textContent = ` (${data.length})`;
          } else {
            notesContainer.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-2 text-center py-8">No hay notas guardadas.</p>`;
          }
        } catch (err) {
          console.error("Error al cargar notas:", err);
        }
      }

      async function deleteNote(id) {
        if (!confirm("¿Estás seguro de que deseas eliminar esta nota?")) return;
        try {
          const res = await fetch(`/notes/${id}`, { method: "DELETE" });
          if (res.ok) {
            loadNotes(searchInput.value.trim());
          } else {
            alert("Error al eliminar la nota.");
          }
        } catch (err) {
          console.error("Error al eliminar:", err);
        }
      }

 

      saveBtn.addEventListener("click", async () => {
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();

        if (title.length < 3) {
          alert("El título debe tener al menos 3 caracteres.");
          return;
        }

        const res = await fetch("/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content }),
        });

        if (res.ok) {
          titleInput.value = "";
          contentInput.value = "";
          loadNotes(searchInput.value.trim());
        } else {
          const data = await res.json();
          alert(data.message || "Error al guardar la nota.");
        }
      });

      searchInput.addEventListener("input", (e) => loadNotes(e.target.value));

      // Cargar al inicio
      loadNotes();
    </script>
  </body>
  <button
    id="themeToggleBtn"
    class="fixed bottom-6 right-6 bg-gray-800 dark:bg-amber-400 text-white dark:text-gray-900 p-4 rounded-full shadow-lg"
  >
    🌙
  </button>
  <script>
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const htmlElement = document.documentElement;
      if (htmlElement.classList.contains("dark")) {
        htmlElement.classList.remove("dark");
        localStorage.removeItem("theme");
      } else {
        htmlElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    });

    // Aplicar el tema guardado en localStorage al cargar la página
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</html>
